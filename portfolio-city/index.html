<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio City</title>
    <link rel="stylesheet" href="./assets/styles.css?v=20260810-center-buildings" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="../" aria-label="AI Study Portal로 이동">
          <span class="brand-mark"><i data-lucide="building-2" aria-hidden="true"></i></span>
          <span>
            <strong>Portfolio City</strong>
            <small>투자 도시 시뮬레이터 가안</small>
          </span>
        </a>

        <div class="market-pill" aria-live="polite">
          <span id="marketName">반도체 강세장</span>
          <strong id="marketPulse">도시 생산성 +1.42%</strong>
        </div>

        <div class="topbar-actions" aria-label="포트폴리오 프리셋">
          <button class="icon-button" type="button" data-preset="balanced" title="균형형" aria-label="균형형 배치">
            <i data-lucide="scale" aria-hidden="true"></i>
          </button>
          <button class="icon-button" type="button" data-preset="growth" title="성장형" aria-label="성장형 배치">
            <i data-lucide="rocket" aria-hidden="true"></i>
          </button>
          <button class="icon-button" type="button" data-preset="defense" title="방어형" aria-label="방어형 배치">
            <i data-lucide="shield" aria-hidden="true"></i>
          </button>
          <button class="primary-button" id="nextMarketDay" type="button">
            <i data-lucide="calendar-days" aria-hidden="true"></i>
            장마감 진행
          </button>
        </div>
      </header>

      <main class="dashboard">
        <aside class="side-panel allocation-panel" aria-label="투자 배분">
          <section class="capital-summary">
            <div>
              <span class="eyebrow">CITY HALL</span>
              <h1 id="cityLevel">시청 Lv.2</h1>
              <p id="cityStatus">운영 자금 안정</p>
            </div>
            <div class="capital-meter" aria-label="시드 머니 사용률">
              <svg viewBox="0 0 120 120" role="img" aria-label="투자 사용률">
                <circle cx="60" cy="60" r="48"></circle>
                <circle id="capitalArc" cx="60" cy="60" r="48"></circle>
              </svg>
              <strong id="investedRate">88%</strong>
            </div>
          </section>

          <section class="stat-grid" aria-label="도시 자금 요약">
            <div>
              <span>시드머니</span>
              <strong id="seedMoney">10,000만원</strong>
            </div>
            <div>
              <span>투자금</span>
              <strong id="investedMoney">8,800만원</strong>
            </div>
            <div>
              <span>현금성 자산</span>
              <strong id="cashMoney">1,200만원</strong>
            </div>
            <div>
              <span>오늘 손익</span>
              <strong id="dailyPnl">+142만원</strong>
            </div>
          </section>

          <section class="control-section">
            <div class="section-title">
              <span>산업 배치</span>
              <small id="allocationHint">10,000만원 기준</small>
            </div>
            <div class="asset-list" id="assetList"></div>
          </section>
        </aside>

        <section class="city-stage" aria-label="도시 성장 지도">
          <div class="stage-header">
            <div>
              <span class="eyebrow">OPERATING FUNDS</span>
              <h2 id="operatingFunds">10,142만원</h2>
            </div>
            <div class="scenario-tabs" id="scenarioTabs" aria-label="시장 시나리오"></div>
          </div>

          <div class="game-hud" aria-label="도시 플레이 상태">
            <div>
              <span>턴</span>
              <strong id="turnNumber">DAY 01</strong>
            </div>
            <div>
              <span>도시 등급</span>
              <strong id="cityGrade">B</strong>
            </div>
            <div>
              <span>가동 건물</span>
              <strong id="buildingCount">8동</strong>
            </div>
          </div>

          <div class="city-map" id="cityMap" aria-label="투자 도시 부지"></div>

          <div class="sector-strip" id="sectorStrip" aria-label="섹터 영향도"></div>
        </section>

        <aside class="side-panel insight-panel" aria-label="선택 건물과 리포트">
          <section class="building-detail" id="buildingDetail"></section>

          <section class="flow-section">
            <div class="section-title">
              <span>가격 흐름</span>
              <small id="flowLabel">선택 종목 기준</small>
            </div>
            <div class="flow-list" id="flowList"></div>
          </section>

          <section class="report-section">
            <div class="section-title">
              <span>도시 운영 리포트</span>
              <small id="reportDate">Day 1</small>
            </div>
            <div class="report-list" id="reportList"></div>
          </section>
        </aside>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./assets/app.js?v=20260810-center-buildings"></script>
  </body>
</html>
